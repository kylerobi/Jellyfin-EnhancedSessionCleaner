framework: "net10.0"
owner: "Trewqa"
overview: "Removes old sessions and allows manual session management."
description: >
  Automatically removes sessions older than a configured limit. 
  
  New features:
  - View active sessions in the dashboard.
  - Manually disconnect/kill specific sessions.
  - Separate cleanup rules for web, TV and other clients.
  - Optionally stop videos that stay paused too long, without signing the client out.

category: "Administration"
artifacts:
  - "Jellyfin.Plugin.EnhancedSessionCleaner.dll"
changelog: |-
  - Fix Stop Paused Playback: now checks automatically every 30 seconds, uses Jellyfin's pause time, and sends the stop the same way Jellyfin does so clients act on it
  - Stop paused playback: stop videos paused longer than a set time (separate web / TV / other limits) without signing the client out
  - Jellyfin 12.0 - 12.4 support (requires Jellyfin 12; use 1.x for Jellyfin 10.11)
  - Separate cleanup rules for web, TV and other clients
